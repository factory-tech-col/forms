steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Set up Node
    uses: actions/setup-node@v4
    with:
      node-version: "20"
      cache: "npm"
      cache-dependency-path: frontend/package-lock.json # O package.json si no usas lock

  - name: Install dependencies
    run: npm ci
    working-directory: ./frontend

  - name: Build
    run: npm run build
    working-directory: ./frontend

  - name: Setup Pages
    uses: actions/configure-pages@v4

  - name: Upload artifact
    uses: actions/upload-pages-artifact@v3
    with:
      path: "./frontend/dist" # Asegúrate de que apunte a la carpeta de compilación de tu frontend
